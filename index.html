<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/src/theme/tokens.css" />
  <link rel="stylesheet" href="/src/theme/dark.css" />
  <title>Microsoft Excel</title>
  <style>
    body { margin: 0; font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif; background: var(--ss-bg); color: var(--ss-text); }
    .demo-info { display: none; }
    .spreadsheet-host { width: 100%; height: 100vh; }
    .ss-root { display: flex; flex-direction: column; width: 100%; height: 100%; background: var(--ss-bg); color: var(--ss-text); }

    /* Excel green title / menu strip */
    .ss-menu-bar { background: var(--ss-menu-bg); border-bottom: 0; box-shadow: none; }
    .ss-menu-strip { display: flex; align-items: center; gap: 0; min-height: 30px; padding: 0 4px; box-sizing: border-box; overflow-x: auto; }
    .ss-menu-trigger { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 10px; color: var(--ss-menu-text); background: transparent; border: 0; border-radius: 0; font: 13px "Segoe UI", "Microsoft YaHei", sans-serif; white-space: nowrap; cursor: default; }
    .ss-menu-trigger:hover, .ss-menu-trigger:focus-visible, .ant-dropdown-open > .ss-menu-trigger { color: var(--ss-menu-text); background: rgba(255,255,255,.16); border-color: transparent; outline: none; }
    .ss-menu-trigger .anticon { color: var(--ss-menu-text); font-size: 13px; opacity: .95; }
    .ss-menu-label { min-width: 180px; display: inline-flex; justify-content: space-between; gap: 24px; align-items: center; }
    .ss-menu-label kbd { color: #8a8a8a; font: 12px "Segoe UI", monospace; background: transparent; border: 0; }

    /* Ribbon / formatting toolbar under menu */
    .ss-interaction-toolbar { min-height: 42px; display: flex; align-items: center; gap: 2px; padding: 4px 8px; background: linear-gradient(#fafafa, #f0f0f0); border-bottom: 1px solid var(--ss-border); box-sizing: border-box; }
    .ss-interaction-toolbar .ant-btn-sm { width: 26px; height: 26px; padding-inline: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 2px; border-color: transparent; background: transparent; color: var(--ss-text); }
    .ss-interaction-toolbar .ant-btn-sm:hover { background: #e6e6e6; border-color: #c6c6c6; color: var(--ss-text); }
    .ss-interaction-toolbar .ant-btn-sm.ant-btn-primary { background: #c6e0b4; border-color: #8ab87a; color: #1f1f1f; }
    .ss-interaction-toolbar .ant-divider-vertical { height: 22px; margin-inline: 6px; border-color: #c8c8c8; }
    .ss-toolbar-toggle { display: inline-flex; align-items: center; gap: 6px; height: 26px; color: var(--ss-text-light); font-size: 12px; white-space: nowrap; margin-left: 4px; }

    /* Formula bar like Excel */
    .ss-formula-bar { display: grid; grid-template-columns: 64px 1px 28px 1fr; gap: 0; align-items: stretch; min-height: 24px; padding: 0; background: #ffffff; border-bottom: 1px solid var(--ss-border); }
    .ss-formula-name { display: flex; align-items: center; justify-content: center; height: 24px; width: 100%; margin: 0; font: 12px "Segoe UI", sans-serif; color: var(--ss-text); background: #ffffff; border: 0; border-right: 1px solid var(--ss-border); border-radius: 0; text-align: center; outline: none; box-sizing: border-box; }
    .ss-formula-name:focus { box-shadow: inset 0 0 0 1px var(--ss-accent); }
    .ss-formula-fx { display: flex; align-items: center; justify-content: center; height: 24px; font: italic 700 12px "Segoe UI", serif; color: #217346; border-right: 1px solid var(--ss-border); background: #f8f8f8; }
    .ss-formula-input { width: 100%; height: 24px; padding: 0 6px; color: var(--ss-text); background: #ffffff; border: 0; border-radius: 0; outline: none; box-sizing: border-box; font: 12px "Segoe UI", "Microsoft YaHei", sans-serif; }
    .ss-formula-input:focus { border-color: transparent; box-shadow: none; }

    .ss-toolbar { display: flex; gap: 8px; padding: 4px 8px; background: var(--ss-toolbar-bg); border-bottom: 1px solid var(--ss-border); }

    /* Sheet tabs */
    .ss-bottom-bar { display: flex; align-items: flex-end; gap: 0; padding: 0 0 0 24px; min-height: 24px; background: #f3f3f3; border-top: 1px solid var(--ss-border); border-bottom: 0; z-index: 1; }
    .ss-sheet-tab { height: 22px; padding: 0 14px; margin: 0 1px 0 0; border: 1px solid transparent; border-bottom: 0; border-radius: 0; background: transparent; color: var(--ss-text); font: 12px "Segoe UI", "Microsoft YaHei", sans-serif; cursor: default; }
    .ss-sheet-tab:hover { background: #eaeaea; }
    .ss-sheet-tab--active { background: #ffffff; border-color: var(--ss-border); border-top: 2px solid var(--ss-accent); color: var(--ss-accent); font-weight: 600; }
    .ss-sheet-add { height: 22px; width: 24px; margin-left: 4px; border: 0; background: transparent; color: var(--ss-text-light); font-size: 14px; cursor: pointer; }
    .ss-sheet-add:hover { background: #e6e6e6; color: var(--ss-text); }

    /* Status bar like Excel (green) */
    .ss-status-bar { display: flex; align-items: center; gap: 14px; padding: 0 10px; background: var(--ss-status-bg); border-top: 0; font-size: 12px; color: var(--ss-status-text); min-height: 22px; }
    .ss-status-item { white-space: nowrap; color: var(--ss-status-text); }
    .ss-status-spacer { flex: 1; }
    .ss-status-divider { color: rgba(255,255,255,.45); }
    .ss-status-save { color: #dff5e5; }

    .ss-canvas-wrap { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #ffffff; }
    /* Floating chart panels over the grid (Excel chart objects). */
    .ss-chart-layer { position: absolute; top: 28px; right: 12px; z-index: 3; display: flex; flex-direction: column; gap: 8px; max-width: min(360px, 60%); pointer-events: none; }
    .ss-chart-layer > * { pointer-events: auto; }
    .ss-chart-panel { background: #ffffff; border: 1px solid var(--ss-border); border-radius: 4px; box-shadow: 0 4px 12px rgba(0,0,0,.15); padding: 8px; }
    .ss-chart-panel-header { display: flex; align-items: center; justify-content: space-between; font: 600 12px "Segoe UI", "Microsoft YaHei", sans-serif; color: var(--ss-text); margin-bottom: 6px; }
    .ss-chart-close { border: 0; background: transparent; color: var(--ss-text); cursor: pointer; font-size: 14px; line-height: 1; padding: 2px 4px; }
    .ss-chart-close:hover { background: #e6e6e6; border-radius: 3px; }
    .ss-canvas { width: 100%; height: 100%; display: block; outline: none; }
    .ss-editor-overlay { position: absolute; box-sizing: border-box; padding: 0 3px; border: 0; background: var(--ss-bg); color: var(--ss-text); font: 11px Calibri, "Segoe UI", "Microsoft YaHei", sans-serif; outline: none; z-index: 2; }
    .ss-editor-overlay.ss-editor-overlay--wrap { white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; }
    canvas { display: block; }
    .ss-canvas:focus-visible, .ss-menu-trigger:focus-visible, .ss-interaction-toolbar .ant-btn-sm:focus-visible, .ss-sheet-tab:focus-visible { outline: 1px solid var(--ss-accent); outline-offset: -1px; }
    .ss-formula-input:focus-visible { outline: none; }
    @media print {
      /* The print document (#ss-print-root, injected by PrintPipeline) replaces the app. */
      .ss-root { display: none !important; }
      .ant-modal-root { display: none !important; }
    }

    /* Find & replace result list */
    .ss-find-list { max-height: 220px; overflow: auto; border: 1px solid var(--ss-border); border-radius: 4px; padding: 2px 0; background: var(--ss-bg); }
    .ss-find-row { display: flex; gap: 10px; align-items: center; width: 100%; padding: 3px 10px; border: 0; background: transparent; color: var(--ss-text); font: 12px "Segoe UI", "Microsoft YaHei", sans-serif; text-align: left; cursor: pointer; }
    .ss-find-row:hover { background: var(--ss-header-bg); }
    .ss-find-row--current { background: var(--ss-selected); outline: 1px solid var(--ss-accent); }
    .ss-find-addr { flex: 0 0 110px; color: var(--ss-accent); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ss-find-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ss-find-more { padding: 4px 10px; font-size: 12px; color: var(--ss-text-light); }

    /* Print preview dialog */
    .ss-print-setting { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; font-size: 12px; color: var(--ss-text); }
    .ss-print-setting > label { color: var(--ss-text-light); }
    .ss-print-pages { flex: 1; min-width: 0; max-height: 470px; overflow: auto; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 8px 12px; background: var(--ss-header-bg); border-radius: 4px; }
    .ss-print-thumb { margin: 0; text-align: center; }
    .ss-print-thumb canvas { display: block; width: 340px; max-width: 100%; height: auto; background: #ffffff; box-shadow: 0 1px 4px rgba(0,0,0,.22); border: 1px solid var(--ss-border); }
    .ss-print-thumb figcaption { margin-top: 4px; font-size: 12px; color: var(--ss-text-light); }

    /* Excel-like context menu */
    .ss-excel-ctx {
      position: fixed;
      z-index: 1100;
      min-width: 220px;
      padding: 4px 0;
      background: #ffffff;
      border: 1px solid #c6c6c6;
      box-shadow: 0 2px 6px rgba(0,0,0,.16);
      border-radius: 0;
      font: 12px "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #1f1f1f;
      user-select: none;
    }
    .ss-excel-ctx__item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      width: 100%;
      height: 24px;
      padding: 0 20px 0 28px;
      margin: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: default;
    }
    .ss-excel-ctx__item:hover:not(:disabled) { background: #cce8ff; }
    .ss-excel-ctx__item:disabled { color: #a6a6a6; }
    .ss-excel-ctx__label { flex: 1; white-space: nowrap; }
    .ss-excel-ctx__shortcut { color: #666; font-size: 11px; white-space: nowrap; }
    .ss-excel-ctx__divider { height: 1px; margin: 4px 0; background: #e0e0e0; }

    .ss-filter-dropdown {
      position: fixed;
      z-index: 1150;
      width: 280px;
      padding: 10px;
      background: #ffffff;
      border: 1px solid #c6c6c6;
      box-shadow: 0 4px 12px rgba(0,0,0,.18);
      display: flex;
      flex-direction: column;
      gap: 8px;
      font: 12px "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .ss-filter-dropdown__sort { display: flex; gap: 6px; }
    .ss-filter-dropdown__list { max-height: 250px; overflow: auto; border: 1px solid #e0e0e0; padding: 6px 4px; }
    .ss-filter-dropdown__list .ant-checkbox-wrapper { display: flex; align-items: center; min-height: 24px; padding: 0 4px; }
    .ss-filter-dropdown__list .ant-checkbox-wrapper:hover { background: #cce8ff; }
    .ss-filter-dropdown__value { flex: 1; display: inline-flex; justify-content: space-between; gap: 12px; min-width: 0; }
    .ss-filter-dropdown__text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ss-filter-dropdown__count { color: #888; font-size: 11px; }
    .ss-filter-dropdown__empty { color: #666; text-align: center; padding: 8px 0; }
    .ss-filter-dropdown__footer { display: flex; justify-content: flex-end; gap: 6px; border-top: 1px solid #e0e0e0; padding-top: 8px; }
    .ss-filter-dropdown__cond { display: flex; flex-direction: column; gap: 6px; border: 1px solid #e0e0e0; padding: 8px; background: #fafafa; }
    .ss-filter-dropdown__cond-row { display: flex; gap: 6px; align-items: center; }
    .ss-filter-dropdown__cond-row .ant-select { min-width: 96px; }
    .ss-filter-dropdown__cond-actions { display: flex; justify-content: flex-end; gap: 6px; }

    .ss-menu-check { display: inline-flex; align-items: center; gap: 6px; }
    .ss-interaction-toolbar .ss-wrap-btn.ant-btn-sm {
      width: auto;
      min-width: auto;
      height: 26px;
      padding-inline: 8px;
      gap: 4px;
      white-space: nowrap;
    }
    .ss-interaction-toolbar .ss-wrap-btn.ant-btn-sm > span {
      font-size: 12px;
      white-space: nowrap;
    }
    /* 合并下拉按钮：左键带文字，豁免工具栏 26px 图标方块规则（右侧箭头键除外）。 */
    .ss-interaction-toolbar .ss-merge-btn .ant-btn-sm:not(.ant-btn-icon-only) {
      width: auto;
      min-width: auto;
      height: 26px;
      padding-inline: 8px;
      gap: 4px;
      white-space: nowrap;
    }
    .ss-interaction-toolbar .ss-merge-btn .ant-btn-sm:not(.ant-btn-icon-only) > span {
      font-size: 12px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <script type="module" src="/demo/main.ts"></script>
</body>
</html>
