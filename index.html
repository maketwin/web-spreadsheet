<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <link rel="stylesheet" href="/src/styles/spreadsheet.css" />
  <title>Microsoft Excel</title>
  <link rel="stylesheet" href="/demo/app.css" />
</head>
<body>
  <script>
    // 把离场中的模态 wrap 一并隐藏：CSS 表达不了"子离场态 → 父隐藏"
    // （:has 老引擎不支持），这里观察 class 变化把离场态镜像到 wrap；
    // 离场类消失（模态框重开）时同步摘除，重开不受影响。
    new MutationObserver(() => {
      for (const wrap of document.querySelectorAll('.ant-modal-wrap')) {
        wrap.classList.toggle('ss-modal-leave-hide', wrap.querySelector(':scope > .ant-modal.ant-zoom-leave') !== null);
      }
    }).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['class'] });
  </script>
  <script type="module" src="/demo/main.ts"></script>
</body>
</html>
