name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `version:` on purpose — the action installs whatever `packageManager`
      # in package.json names, so CI runs the same pnpm as a local checkout.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Through the package script rather than `pnpm test --coverage`: the
      # flag belonged to pnpm itself in pnpm 9 ("Unknown option: 'coverage'").
      - name: Test (coverage report)
        run: pnpm coverage

      - name: Build
        run: pnpm build

      # Loads the built package through its exports map (ESM + CommonJS) and
      # checks the stylesheet and type entries.
      - name: Check build artifacts
        run: pnpm check:dist

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Playwright's version is pinned by the lockfile, so browser builds
          # stay valid until a dependency bump changes the key.
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (boots the vite dev server itself)
        run: pnpm exec playwright test
